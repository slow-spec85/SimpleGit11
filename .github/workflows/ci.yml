name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Release x64
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          architecture: x64

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore
        run: msbuild SimpleGit11.slnx /t:Restore /m /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild SimpleGit11.slnx /t:Build /m /warnaserror /p:Configuration=Release /p:Platform=x64 /p:AcceptEula=wix7

      - name: Test application and SSH plugin
        timeout-minutes: 10
        run: dotnet test --test-modules "SimpleGit11*.Tests/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/SimpleGit11*.Tests.dll" --max-parallel-test-modules 1 --output Detailed --timeout 5m --diagnostic --diagnostic-output-directory TestResults/diagnostics --report-trx --results-directory TestResults

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: TestResults/
          if-no-files-found: warn
